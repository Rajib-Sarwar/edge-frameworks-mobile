name: Release v0.3.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.3.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          if git rev-parse "v0.3.0" >/dev/null 2>&1; then
            echo "Tag v0.3.0 already exists."
          else
            git config user.name "Rajib Sarwar"
            git config user.email "md.rajib.sarwar@gmail.com"
            git tag -a v0.3.0 -m "edge-frameworks-mobile v0.3.0"
            git push origin v0.3.0
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo "Release v0.3.0 already exists."
          else
            gh release create v0.3.0 \
              --title "edge-frameworks-mobile v0.3.0" \
              --notes-file docs/releases/v0.3.0.md
          fi
