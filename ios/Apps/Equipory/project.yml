name: Equipory

options:
  bundleIdPrefix: com.rajibsarwar.equipory
  deploymentTarget:
    iOS: "26.0"

packages:
  EdgeFrameworks:
    path: ../..

targets:
  Equipory:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajibsarwar.equipory
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: EdgeFrameworks
        product: EdgeFrameworks
